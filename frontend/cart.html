<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Cart — zazenware</title>
  <meta name="description" content="Review your zazenware order and proceed to e-transfer checkout.">

  <script src="/scripts/theme-init.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Special+Elite&family=UnifrakturMaguntia&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/cart.css">
</head>

<body>
  <div id="site-header"></div>

  <main id="main-content" class="zw-container zw-stack-xl" style="padding-block: var(--zw-space-8);">
    <!-- HERO -->
    <section class="zw-hero">
      <div class="zw-hero__eyebrow">Review your order</div>
      <h1 class="zw-hero__title zw-display">cart</h1>
      <p class="zw-hero__sub">
        Check your items and total before proceeding to checkout.
      </p>
    </section>

    <!-- CART APP AREA -->
    <section class="zw-stack">
      <!-- Empty state controlled by cart-page.js -->
      <div id="cart-empty" hidden>
        <article class="zw-panel" style="text-align: center;">
          <p>Your cart is empty</p>
          <p style="margin-top: var(--zw-space-3);">
            <a href="/shop.html" class="zw-btn zw-btn--primary zw-btn--small">
              Continue shopping
            </a>
          </p>
        </article>
      </div>

      <!-- Items controlled by cart-page.js -->
      <div id="cart-items" hidden></div>

      <!-- Summary + checkout form controlled by cart-page.js -->
      <aside id="cart-summary" hidden></aside>
    </section>
  </main>

  <div id="site-footer"></div>

  <script type="module" src="/scripts/partials.js"></script>
  <script type="module" src="/scripts/theme.js"></script>
  <script type="module" src="/scripts/nav.js"></script>
  <script type="module" src="/scripts/cart-badge.js"></script>
  <script type="module" src="/scripts/cart-page.js"></script>
</body>
</html>
